name: Paydiant
description: >-
  Paydiant was a Boston-based mobile-wallet, point-of-sale and cloud payments
  platform, backed by General Catalyst, that let banks, merchants and retailers
  build their own white-label mobile-payment and loyalty apps (notably powering
  the retailer-led MCX "CurrentC" wallet). PayPal acquired Paydiant in 2015 and
  folded the technology into its in-store and merchant products; Paydiant no
  longer operates as an independent company. This API Evangelist profile was
  surfaced as a General Catalyst portfolio lead; an enrichment probe on
  2026-07-20 found no live independent API surface — the paydiant.com domain and
  its api/developer/docs subdomains wildcard-resolve to a PayPal/MarkMonitor
  brand-protection parking IP (3.33.139.32) and serve no content.
